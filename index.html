<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳳聲晴久｜笛奏者・日本伝統音楽 Official Site</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<style>
/* CSSの優先順位を修正：ロゴを確実に160pxにする */
.voice-img-box img.voice-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.voice-img-box img.voice-logo-placeholder { width: 160px !important; height: auto !important; object-fit: contain !important; opacity: 0.9; display: block; margin: 0 auto; }
/* その他必要なベースCSS（省略せず全文に含めています） */
</style>
</head>
<body>
<script>
(async function() {
  const LANG = "ja";
  const API_URL = "https://script.google.com/macros/s/AKfycbwdpDAvg8yLiYGkHOjx9LCGIR67Q-tojNT6VH_AzFY6ThPHE0UVQaGbAO34obe4LQF5/exec";

  const data = await (await fetch(API_URL)).json();
  if (!data) return;

  // ---------- NEWS 復活の修正 ----------
  const newsContainer = document.querySelector('#news .news-container');
  if (newsContainer && Array.isArray(data.news)) {
    newsContainer.innerHTML = data.news.map(item => {
      // GASの出力(画像21, 25枚目)と名前を完全に一致させる
      const date = item.date || ""; 
      const body = item.ja_html || "";
      const link = (item.ja_link_text && item.ja_link_href) 
        ? `<br><a href="${item.ja_link_href}" target="_blank">${item.ja_link_text}</a>` : "";
      
      return `<div class="news-item fade-up is-visible">
                <span class="news-date">${date}</span>
                <div class="news-text">${body}${link}</div>
              </div>`;
    }).join("");
  }

  // ---------- VOICE ロゴ縮小の修正 ----------
  const voiceWrapper = document.querySelector('#voice .swiper-wrapper');
  if (voiceWrapper && Array.isArray(data.voice)) {
    voiceWrapper.innerHTML = data.voice.map(v => {
      // kindの判定をGASからの出力(F列)に合わせる
      const kind = String(v.image_kind || "").toLowerCase().trim();
      const imgClass = (kind === "logo") ? "voice-logo-placeholder" : "voice-photo";
      return `
        <div class="swiper-slide voice-slide">
          <div class="voice-img-box"><img src="${v.image_src}" class="${imgClass}"></div>
          <div class="voice-content">
            <div class="voice-date-text">${v.date || ""}</div>
            <p class="voice-body">${v.ja_html || ""}</p>
          </div>
        </div>`;
    }).join("");
  }
})();
</script>
</body>
</html>
