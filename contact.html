<script>
        document.addEventListener('DOMContentLoaded', function() {
            // ハンバーガーメニュー
            const menuBtn = document.getElementById('menuBtn');
            const navOverlay = document.getElementById('navOverlay');
            
            menuBtn.addEventListener('click', () => {
                const isOpen = menuBtn.classList.toggle('is-open');
                navOverlay.classList.toggle('is-open');
            });

            // アニメーション
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

            // ▼ 言語切り替え機能を追加 ▼
            const langToggle = document.getElementById('langToggle');
            const langMenu = document.getElementById('langMenu');
            if(langToggle && langMenu){
                langToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    langMenu.classList.toggle('is-open');
                });
                document.addEventListener('click', (e) => {
                    if (!langToggle.contains(e.target) && !langMenu.contains(e.target)) {
                        langMenu.classList.remove('is-open');
                    }
                });
            }
        });
    </script>

<script>
(function(){
  function onReady(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  onReady(function(){
    var menuBtn = document.getElementById('menuBtn');
    var navOverlay = document.getElementById('navOverlay');
    var langToggle = document.getElementById('langToggle');
    var langMenu = document.getElementById('langMenu');

    function setExpanded(el, val){ if(!el) return; el.setAttribute('aria-expanded', val ? 'true' : 'false'); }

    // Hamburger: add keyboard support + aria sync (works even if existing click handler exists)
    if(menuBtn && navOverlay){
      menuBtn.addEventListener('click', function(){
        setExpanded(menuBtn, menuBtn.classList.contains('is-open'));
      }, true);

      menuBtn.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          menuBtn.click();
        }
      });
    }

    // Language menu: aria sync + escape close
    if(langToggle && langMenu){
      langToggle.addEventListener('click', function(){
        setExpanded(langToggle, langMenu.classList.contains('is-open'));
      }, true);
    }

    document.addEventListener('keydown', function(e){
      if(e.key !== 'Escape') return;

      if(langMenu && langMenu.classList.contains('is-open')){
        langMenu.classList.remove('is-open');
        setExpanded(langToggle, false);
      }
      if(menuBtn && menuBtn.classList.contains('is-open')){
        menuBtn.classList.remove('is-open');
        if(navOverlay) navOverlay.classList.remove('is-open');
        setExpanded(menuBtn, false);
      }
    });

    // Click-outside close for language menu (if not already)
    if(langToggle && langMenu){
      document.addEventListener('click', function(e){
        if(langMenu.classList.contains('is-open') &&
           !langToggle.contains(e.target) &&
           !langMenu.contains(e.target)){
          langMenu.classList.remove('is-open');
          setExpanded(langToggle, false);
        }
      });
    }

    // Touch feedback for hamburger (instant "pressed" feel)
    if(menuBtn){
      var pressOn = function(){ menuBtn.classList.add('is-pressing'); };
      var pressOff = function(){ menuBtn.classList.remove('is-pressing'); };

      menuBtn.addEventListener('pointerdown', pressOn);
      menuBtn.addEventListener('pointerup', pressOff);
      menuBtn.addEventListener('pointercancel', pressOff);
      menuBtn.addEventListener('pointerleave', pressOff);
      // Fallback for older iOS Safari
      menuBtn.addEventListener('touchstart', pressOn, {passive:true});
      menuBtn.addEventListener('touchend', pressOff);
      menuBtn.addEventListener('touchcancel', pressOff);
    }

  });
})();
</script>
